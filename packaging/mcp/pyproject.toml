[project]
name = "agentsumo-mcp"
version = "0.1.1"
description = "MCP server for SUMO traffic simulation: orchestrate networks, trips, simulations, and analysis from LLM agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Minwoo Jeong" },
    { name = "Jeeyun Chang" },
    { name = "Yoonjin Yoon" },
]
keywords = ["mcp", "sumo", "traffic-simulation", "llm", "agent", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mcp[cli]>=1.13.1",
    "sumolib>=1.24.0",
    "geopy>=2.4.1",
    "geopandas>=0.14.3,<0.15.0",
    "pandas>=2.3.2",
    "shapely>=2.1.1",
    "pyproj>=3.6.0",
    "lxml>=5.0.0",
    "ddgs>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/mw-jeong/AgentSUMO"
Documentation = "https://agentsumo.readthedocs.io"
Repository = "https://github.com/mw-jeong/AgentSUMO"
Issues = "https://github.com/mw-jeong/AgentSUMO/issues"

[project.scripts]
agentsumo-mcp = "agentsumo_mcp.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentsumo_mcp*"]
exclude = ["agentsumo_mcp.__pycache__*"]

[tool.setuptools.package-data]
agentsumo_mcp = ["**/*.xml", "**/*.typ.xml", "**/*.txt", "**/*.json"]
