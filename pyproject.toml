[project]
name = "agentsumo"
version = "0.1.0"
description = "AgentSUMO: AI-Powered SUMO Traffic Simulation Platform with Claude and MCP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # AgentSUMO MCP server (published separately on PyPI)
    "agentsumo-mcp>=0.1.2",
    # Reasoning backend
    "anthropic>=0.39.0",
    # Configuration loading
    "python-dotenv>=1.0.0",
    # Web interface
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "jinja2>=3.1.0",
    # Spatial / geo / visualization
    "geopandas>=0.14.3,<0.15.0",
    "geopy>=2.4.1",
    "shapely>=2.1.1",
    "pyproj>=3.6.0",
    "matplotlib>=3.10.6",
    "folium>=0.20.0",
    # SUMO + XML
    "sumolib>=1.24.0",
    "lxml>=5.0.0",
    "rtree>=1.0.0",
    "osmium>=4.1.1",
    # Data manipulation
    "numpy>=1.26.4",
    "pandas>=2.3.2",
    "pyarrow>=22.0.0",
    # External helpers
    "ddgs>=9.0.0",
    "certifi>=2025.8.3",
    # MCP protocol library (also a transitive dep of agentsumo-mcp, but
    # imported directly by agentsumo/client)
    "mcp[cli]>=1.13.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsumo*"]
exclude = ["data*", "output*", "checkpoints*", "tests*", "__pycache__*", "*.egg-info*", "sumo_mcp*", "examples*"]

[tool.setuptools.package-data]
agentsumo = ["*.txt", "*.json", "*.xml"]
